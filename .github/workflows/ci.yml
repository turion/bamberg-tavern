name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: bamberg-tavern
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Nix flake check HLS (needs internet access)
        run: nix flake check --option sandbox false

      - name: Build
        run: nix build .#bamberg-tavern

  fourmolu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/run-fourmolu@v13

  cabal-gild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: tfausak/cabal-gild-setup-action@v2
      - run: cabal-gild --input bamberg-tavern.cabal --mode check

  pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build PDFs
        run: nix build .#all-pdfs

  success:
    name: Successfully build and test on all systems
    # A single required check that fails unless every other job succeeded, so
    # branch protection does not have to name them one by one. Every job
    # defined above must appear below: the list is hand-maintained, and a job
    # missing from it cannot turn the gate red.
    # `if: always()` is load-bearing — GitHub skips a job whose dependency
    # failed, and branch protection counts a skipped required check as
    # passing, so without it the gate would go green on a red build. Do not
    # change it to `!cancelled()` — a cancelled dependency would then skip
    # this job, and a skipped required check reports Success.
    needs:
      - build-and-test
      - fourmolu
      - cabal-gild
      - pdfs
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency did not succeed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
